<div class="auth-container">
  <div class="auth-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Log in to access your account dashboard</p>

    <div *ngIf="errorMessage()" class="alert alert-danger">
      {{ errorMessage() }}
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" [(ngModel)]="credentials.email" name="email" required class="form-control" placeholder="name@company.com" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" [(ngModel)]="credentials.password" name="password" required class="form-control" placeholder="••••••••" />
      </div>

      <button type="submit" [disabled]="!loginForm.form.valid || isLoading()" class="btn-primary">
        {{ isLoading() ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a routerLink="/signup">Sign up</a>
    </p>
  </div>
</div>
